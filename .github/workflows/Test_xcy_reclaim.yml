name: Test event-driven XiaoCaiYe kernel components

on:
  push:
    branches: [codex/ace6-118-xcy-reclaim]
    paths:
      - .github/workflows/Test_xcy_reclaim.yml
      - efficiency/xcy-reclaim/**

permissions:
  contents: read

jobs:
  verify-port:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Verify pressure transitions with proactive PAGEOUT disabled
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=undefined \
            efficiency/xcy-reclaim/test_without_pageout.c -o "$RUNNER_TEMP/xcy-kill-only"
          "$RUNNER_TEMP/xcy-kill-only"
          cc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=undefined \
            efficiency/xcy-reclaim/test_candidates.c efficiency/xcy-reclaim/xcy_reclaim_candidates.c \
            efficiency/xcy-reclaim/xcy_reclaim_importance.c -o "$RUNNER_TEMP/xcy-candidates"
          "$RUNNER_TEMP/xcy-candidates"
          cc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=undefined \
            efficiency/xcy-reclaim/test_plan.c efficiency/xcy-reclaim/xcy_reclaim_plan.c \
            efficiency/xcy-reclaim/xcy_reclaim_candidates.c efficiency/xcy-reclaim/xcy_reclaim_importance.c \
            efficiency/xcy-reclaim/xcy_reclaim_rank.c efficiency/xcy-reclaim/xcy_reclaim_urgent.c \
            -o "$RUNNER_TEMP/xcy-plan"
          "$RUNNER_TEMP/xcy-plan"
          cc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=undefined \
            efficiency/xcy-reclaim/test_protection.c efficiency/xcy-reclaim/xcy_reclaim_protection.c \
            efficiency/xcy-reclaim/xcy_reclaim_lease.c \
            -o "$RUNNER_TEMP/xcy-protection"
          "$RUNNER_TEMP/xcy-protection"
      - name: Compile the components against the pinned ARM64 6.6.118 kernel
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq --no-install-recommends bc bison clang flex libelf-dev lld llvm
          source_ref=65b954a773b183a9999b06bb1b2f921f12eaaf11
          kernel="$RUNNER_TEMP/xcy-kernel"
          out="$RUNNER_TEMP/xcy-kernel-out"
          mkdir -p "$kernel" "$out"
          curl --fail --location --retry 3 --silent --show-error \
            "https://codeload.github.com/OnePlusOSS/android_kernel_common_oneplus_sm8750/tar.gz/$source_ref" \
            | tar xz -C "$kernel" --strip-components=1
          test "$(make -s -C "$kernel" kernelversion)" = 6.6.118
          python3 efficiency/xcy-reclaim/install_builtin.py --kernel "$kernel"
          make -s -C "$kernel" O="$out" ARCH=arm64 LLVM=1 gki_defconfig
          grep -qx 'CONFIG_XCY_RECLAIM=y' "$out/.config"
          make -s -C "$kernel" -j2 O="$out" ARCH=arm64 LLVM=1 mm/xcy-reclaim/built-in.a
          objects="$(llvm-ar t "$out/mm/xcy-reclaim/built-in.a")"
          for source in sources policy lease; do
            grep -E "(^|/)xcy_reclaim_${source}\.o$" <<< "$objects"
          done
