name: Build paired BakaSU manager

on:
  workflow_call:
    secrets:
      BAKASU_PAIRED_KEYSTORE:
        required: false
      BAKASU_PAIRED_KEYSTORE_PASSWORD:
        required: false
      BAKASU_PAIRED_KEY_ALIAS:
        required: false
    inputs:
      kernel_run:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      manager_package:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      kernel_run:
        description: Verified kernel run; empty selects the latest signed build for this kernel
        required: false
      kernel_version:
        description: Kernel version of the paired boot
        required: true
        default: '6.6.89'
      manager_package:
        description: Application ID; unsigned output requires an owner signing key
        required: true
        default: com.resukisu.resukisu

permissions:
  contents: read
  actions: read

jobs:
  manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      KERNEL_RUN: ${{ inputs.kernel_run }}
      KERNEL_VERSION: ${{ inputs.kernel_version }}
      KSU_PACKAGE_NAME: ${{ inputs.manager_package }}
    steps:
      - uses: actions/checkout@v5
      - name: Reproduce the verified kernel's BakaSU source
        run: |
          set -euo pipefail
          [[ "$KERNEL_VERSION" =~ ^6\.6\.[0-9]+$ ]]
          if [ -z "$KERNEL_RUN" ]; then
            for candidate in $(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow Build_Lenovo_sm8750.yml --status success --limit 20 \
              --json databaseId --jq '.[].databaseId'); do
              names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" \
                --jq '.artifacts[] | select(.expired == false) | .name')
              if grep -Fxq "preflash-verification_$KERNEL_VERSION" <<< "$names" && \
                 grep -q '^Boot_' <<< "$names"; then
                KERNEL_RUN=$candidate
                break
              fi
            done
          fi
          [[ "$KERNEL_RUN" =~ ^[0-9]+$ ]]
          echo "KERNEL_SOURCE_RUN=$KERNEL_RUN" >> "$GITHUB_ENV"
          gh run download "$KERNEL_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "preflash-verification_$KERNEL_VERSION" --dir evidence
          commit=$(tr -d '\r\n' < evidence/bakasu-commit.txt)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          git clone --filter=blob:none https://github.com/Baka-SU/BakaSU.git bakasu
          git -C bakasu checkout --detach "$commit"
          git -C bakasu submodule update --init --recursive
          python3 .github/scripts/paired_manager.py prepare --source bakasu \
            --evidence evidence --kernel-run "$KERNEL_RUN" \
            --package "$KSU_PACKAGE_NAME" --report paired-manager
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the source-pinned Android toolchain
        run: |
          set -euo pipefail
          ndk=$(sed -n 's/^ndk = "\([^"]*\)"/\1/p' bakasu/manager/gradle/libs.versions.toml)
          test -n "$ndk"
          sdkmanager "platforms;android-37.0" "build-tools;36.1.0" "ndk;$ndk" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - name: Preserve the matching upstream installer payloads
        run: |
          set -euo pipefail
          commit=$(tr -d '\r\n' < evidence/bakasu-commit.txt)
          run=$(gh run list --repo Baka-SU/BakaSU --workflow build-manager.yml \
            --commit "$commit" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run" && test "$run" != null
          gh run download "$run" --repo Baka-SU/BakaSU --pattern 'aarch64-*-lkm' \
            --pattern ksuinit-aarch64 --dir upstream-payloads
          find upstream-payloads -name '*_kernelsu.ko' -exec cp {} bakasu/userspace/ksud/bin/aarch64/ \;
          cp upstream-payloads/ksuinit-aarch64/ksuinit bakasu/userspace/ksud/bin/aarch64/
          printf '%s\n' "$run" > paired-manager/installer-payload-source-run.txt
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bakasu/userspace/ksud
      - name: Build the paired ksud
        run: |
          set -euo pipefail
          cargo install cargo-ndk --locked
          clang --target=aarch64-linux-gnu -c -nostdlib \
            -o bakasu/userspace/ksud/.lkm_image_bootstrap.o \
            bakasu/userspace/ksud/src/lkm_image_bootstrap.S
          cd bakasu/userspace/ksud
          cargo ndk b -P 26 -t aarch64-linux-android -r --locked \
            -Z build-std-features=optimize_for_size -Z trim-paths
      - name: Build the paired manager
        working-directory: bakasu/manager
        run: |
          set -euo pipefail
          manager_name=BakaSU
          if [ "$KSU_PACKAGE_NAME" != com.resukisu.resukisu ]; then
            manager_name='BakaSU 配套版'
          fi
          ./gradlew assembleRelease -Pcommit="$(git rev-parse HEAD)" \
            -PKSU_PACKAGE_NAME="$KSU_PACKAGE_NAME" -PKSU_NAME="$manager_name"
      - name: Package and verify the exact compiled daemon
        run: |
          python3 .github/scripts/paired_manager.py package --source bakasu \
            --report paired-manager --zipalign "$ANDROID_HOME/build-tools/36.1.0/zipalign"
      - name: Sign and verify the owner APK
        env:
          OWNER_KEYSTORE: ${{ secrets.BAKASU_PAIRED_KEYSTORE }}
          OWNER_STORE_PASSWORD: ${{ secrets.BAKASU_PAIRED_KEYSTORE_PASSWORD }}
          OWNER_KEY_ALIAS: ${{ secrets.BAKASU_PAIRED_KEY_ALIAS }}
          OWNER_CERT_SHA256: ${{ vars.BAKASU_MANAGER_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$OWNER_KEYSTORE" ]; then
            if [ -n "$OWNER_STORE_PASSWORD$OWNER_KEY_ALIAS$OWNER_CERT_SHA256" ]; then
              echo '::error::Owner signing configuration is incomplete.'
              exit 1
            fi
            echo 'Owner signing is not configured; keeping the explicitly unsigned artifact.'
            exit 0
          fi
          test -n "$OWNER_STORE_PASSWORD" && test -n "$OWNER_KEY_ALIAS" && test -n "$OWNER_CERT_SHA256"
          umask 077
          owner_keystore_path=$(mktemp "$RUNNER_TEMP/bakasu-owner.XXXXXX.p12")
          trap 'rm -f "$owner_keystore_path"' EXIT
          printf '%s' "$OWNER_KEYSTORE" | base64 --decode > "$owner_keystore_path"
          python3 .github/scripts/paired_manager.py sign --source bakasu \
            --report paired-manager --apksigner "$ANDROID_HOME/build-tools/36.1.0/apksigner" \
            --keystore "$owner_keystore_path" --alias "$OWNER_KEY_ALIAS" \
            --password-env OWNER_STORE_PASSWORD --expected-cert-sha256 "$OWNER_CERT_SHA256"
      - name: Upload paired manager and provenance
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: paired-manager-${{ env.KERNEL_SOURCE_RUN || github.run_id }}
          path: paired-manager/
          if-no-files-found: error
